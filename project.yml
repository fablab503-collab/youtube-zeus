name: YouTubeZeus
options:
  bundleIdPrefix: com.danielmadac
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "4.2"
    CURRENT_PROJECT_VERSION: "24"
    DEVELOPMENT_TEAM: B7P7FR67VK
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_APP_SANDBOX: NO
targets:
  YouTubeZeus:
    type: application
    platform: macOS
    sources:
      - path: YouTubeZeus
        excludes:
          - "AppIcon.icon"
      - path: YouTubeZeus/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielmadac.youtubezeus
        PRODUCT_NAME: YouTube Zeus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: YouTubeZeus/Info.plist
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        # The "Copy the Effects engine" phase reads the whole effects/ folder, which a sandboxed script cannot
        # (a folder as input does not open its files). It is the only script phase of this target.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Zeus Effects (3.8): the free local engine (effects/, Python) ships inside the app as
      # Contents/Resources/effects, without its tests or caches. Its venv and weights live in Application Support.
      - name: Copy the Effects engine
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/effects
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/effects
        script: |
          set -e
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/effects"
          mkdir -p "$DEST"
          if [ -d "${SRCROOT}/effects" ]; then
            /usr/bin/rsync -a --delete \
              --exclude 'tests/' --exclude '__pycache__/' --exclude '*.pyc' --exclude '.venv/' \
              --exclude '.pytest_cache/' --exclude '.DS_Store' --exclude '*.log' \
              "${SRCROOT}/effects/" "$DEST/"
          fi
    info:
      path: YouTubeZeus/Info.plist
      properties:
        CFBundleDisplayName: YouTube Zeus
        CFBundleName: YouTube Zeus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Daniel Madac · FabLab 503"
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.danielmadac.youtubezeus
            CFBundleURLSchemes: [youtubezeus]
